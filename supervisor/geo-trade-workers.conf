; ====================================================================
; Geo Trade Terminal - Supervisor Queue Worker Configuration
; Production daemon management for dedicated Redis queue pipelines
; ====================================================================

[group:geo-trade-terminal]
programs=geo-trade-gazette-worker,geo-trade-alerts-worker

; Worker 1: Gazette Ingestion & PDF Parser Queue
[program:geo-trade-gazette-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /Applications/XAMPP/xamppfiles/htdocs/geo-trade-terminal/artisan queue:work redis --queue=gazette-ingestion --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/Applications/XAMPP/xamppfiles/htdocs/geo-trade-terminal/storage/logs/supervisor_gazette.log
stopwaitsecs=3600

; Worker 2: Portfolio Watchlist Matching & Alert Dispatcher Queue
[program:geo-trade-alerts-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /Applications/XAMPP/xamppfiles/htdocs/geo-trade-terminal/artisan queue:work redis --queue=alerts --sleep=2 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/Applications/XAMPP/xamppfiles/htdocs/geo-trade-terminal/storage/logs/supervisor_alerts.log
stopwaitsecs=3600
